<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Image Display</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #fdfdfd;
    }
    img {
      display: block;
      margin: auto;
      max-width: 100%;
      max-height: 100vh;
      object-fit: contain;
      border: none;
      outline: none;
    }
    a, a:focus, a:active {
      outline: none;
    }
    a img {
      border: none;
    }
  </style>
</head>
<body>
  <img src="About.png" alt="About">
</body>
</html>
