            </div>
            <div class="divider">
                <br>
                <hr>
                <br>
            </div>
            <a href="about.html" target="display" class="mains">About</a>
            <a href="projects.html" target="display" class="mains">Projects</a>
            <a href="pdfjs/web/viewer.html?file=/New-Resume.pdf#page=1&zoom=page-height&pagemode=none" 
            target="display"
            class="mains">Resume</a>

            <div class="bottomItem main">
                <a href="mailto:shuklaisal@gmail.com" class="desc">shuklaisal@gmail.com</a><br>
                <a href="https://www.linkedin.com/in/isal-shukla-6b6094115/" target="blank" class="social">LinkedIn</a><span> | </span>

        </div>
        <button id="openSidebarBtn">+</button>
        <div id="main">
            <iframe name="display" class="display" src="projects.html"></iframe>
        </div>
    </body>

    <script>
        const sidebar = document.getElementById('sidebar');

        /* Sidebar toggle functionality */
        const toggleBtn = document.getElementById('openSidebarBtn');

        toggleBtn.addEventListener('click', () => {
            if (sidebar.style.display === 'block') {
                sidebar.style.display = 'none';
                toggleBtn.textContent = '+';
            } else {
                sidebar.style.display = 'block';
                toggleBtn.textContent = '×';
            }

        });
        
        window.addEventListener('resize', () => {
            if (window.innerWidth < 600) {
                sidebar.style.display = 'block'; 
                toggleBtn.textContent = '×';
            }
        });

        function toggleSidebar() {
            document.body.classList.toggle('sidebar-open');
        }

        const navLinks = document.querySelectorAll('.mains');
        navLinks.forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth < 600) {
                    sidebar.style.display = 'none';
                    toggleBtn.textContent = '+';
                }
            });
        });
    </script>
</html>
