<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            padding: 20px;
        }
        
        .calculator {
            width: 100%;
            max-width: 400px;
            background-color: #2c3e50;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }
        
        .display {
            background-color: #1a252f;
            padding: 30px 20px;
            text-align: right;
            position: relative;
        }
        
        .previous-operand {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.2rem;
            min-height: 24px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .current-operand {
            color: white;
            font-size: 2.5rem;
            font-weight: 500;
            margin-top: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background-color: #34495e;
        }
        
        button {
            border: none;
            outline: none;
            padding: 20px 10px;
            font-size: 1.4rem;
            cursor: pointer;
            background-color: #2c3e50;
            color: white;
            transition: all 0.2s ease;
        }
        
        button:hover {
            background-color: #34495e;
            transform: scale(1.05);
        }
        
        button:active {
            background-color: #3d566e;
            transform: scale(0.95);
        }
        
        .operator {
            background-color: #3498db;
            font-weight: bold;
        }
        
        .operator:hover {
            background-color: #2980b9;
        }
        
        .equals {
            background-color: #e74c3c;
            grid-column: span 2;
        }
        
        .equals:hover {
            background-color: #c0392b;
        }
        
        .clear, .delete {
            background-color: #34495e;
        }
        
        .clear:hover, .delete:hover {
            background-color: #2c3e50;
        }
        
        .zero {
            grid-column: span 2;
        }
        
        .calculator-title {
            text-align: center;
            color: white;
            padding: 15px 0;
            background-color: #1a252f;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }
        
        @media (max-width: 480px) {
            button {
                padding: 18px 5px;
                font-size: 1.2rem;
            }
            
            .current-operand {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="calculator-title">Modern Calculator</div>
        <div class="display">
            <div class="previous-operand" id="previous-operand"></div>
            <div class="current-operand" id="current-operand">0</div>
        </div>
        <div class="buttons">
            <button class="clear" data-action="clear">C</button>
            <button class="delete" data-action="delete">DEL</button>
            <button class="operator" data-operation="÷">÷</button>
            <button class="operator" data-operation="*">×</button>
            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operator" data-operation="-">-</button>
            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operator" data-operation="+">+</button>
            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="equals" data-action="calculate">=</button>
            <button class="zero" data-number="0">0</button>
            <button data-number=".">.</button>
        </div>
    </div>

    <script>
        // Calculator state
        let currentOperand = '0';
        let previousOperand = '';
        let operation = undefined;
        let shouldResetScreen = false;
        
        // DOM elements
        const currentOperandElement = document.getElementById('current-operand');
        const previousOperandElement = document.getElementById('previous-operand');
        const buttons = document.querySelectorAll('button');
        
        // Update display
        function updateDisplay() {
            currentOperandElement.textContent = currentOperand;
            if (operation != null) {
                previousOperandElement.textContent = `${previousOperand} ${operation}`;
            } else {
                previousOperandElement.textContent = previousOperand;
            }
        }
        
        // Append number
        function appendNumber(number) {
            if (currentOperand === '0' || shouldResetScreen) {
                currentOperand = number;
                shouldResetScreen = false;
            } else {
                currentOperand += number;
            }
        }
        
        // Choose operation
        function chooseOperation(op) {
            if (currentOperand === '') return;
            if (previousOperand !== '') {
                calculate();
            }
            operation = op;
            previousOperand = currentOperand;
            shouldResetScreen = true;
        }
        
        // Calculate
        function calculate() {
            let computation;
            const prev = parseFloat(previousOperand);
            const current = parseFloat(currentOperand);
            if (isNaN(prev) || isNaN(current)) return;
            
            switch (operation) {
                case '+':
                    computation = prev + current;
                    break;
                case '-':
                    computation = prev - current;
                    break;
                case '*':
                    computation = prev * current;
                    break;
                case '÷':
                    if (current === 0) {
                        computation = "Error";
                    } else {
                        computation = prev / current;
                    }
                    break;
                default:
                    return;
            }
            
            currentOperand = computation.toString();
            operation = undefined;
            previousOperand = '';
            shouldResetScreen = true;
        }
        
        // Clear calculator
        function clear() {
            currentOperand = '0';
            previousOperand = '';
            operation = undefined;
        }
        
        // Delete last digit
        function deleteNumber() {
            currentOperand = currentOperand.toString().slice(0, -1);
            if (currentOperand === '') {
                currentOperand = '0';
            }
        }
        
        // Add decimal point
        function appendDecimal() {
            if (shouldResetScreen) {
                currentOperand = '0.';
                shouldResetScreen = false;
                return;
            }
            
            if (currentOperand.includes('.')) return;
            currentOperand += '.';
        }
        
        // Event listeners
        buttons.forEach(button => {
            button.addEventListener('click', () => {
                if (button.dataset.number) {
                    if (button.dataset.number === '.') {
                        appendDecimal();
                    } else {
                        appendNumber(button.dataset.number);
                    }
                } else if (button.dataset.operation) {
                    chooseOperation(button.dataset.operation);
                } else if (button.dataset.action === 'calculate') {
                    calculate();
                } else if (button.dataset.action === 'clear') {
                    clear();
                } else if (button.dataset.action === 'delete') {
                    deleteNumber();
                }
                
                updateDisplay();
            });
        });
        
        // Initialize display
        updateDisplay();
    </script>
</body>
</html>
