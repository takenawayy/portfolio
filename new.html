<html lang="eng">
    <head>
        <title>Home</title>
        <link rel="stylesheet" href="stylish.css">
        <link rel="stylesheet" href="font.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div id="sidebar">
            <div class="icon" id="homeIcon">
                <p class="namefirst"><strong>ISAL</strong></p>
                <p class="namelast"><strong>SHUKLA</strong></p>
            </div>
            <br>
            <hr>
            <br>
            <a href="about.html" target="display" class="mains">About</a>
            <br>
            <a href="projects.html" target="display" class="mains">Projects</a>
            <br>
            <a href="New Resume.pdf#page=1&zoom=page-width&pagemode=thumbs" target="display" class="mains">Resume</a>
            <div id="resizer">
                <div class="line"></div>
            </div>
            <div class="bottomItem main">
                <p class="desc">Email: shuklaisal@gmail.com</p>
                <br>
                <a href="about.html" target="display" class="social">Instagram</a>
                <a href="projects.html" target="display" class="social">Facebook</a>
                <a href="New Resume.pdf" target="display" class="social">LinkedIn</a>
            </div>
        </div>
        <button id="openSidebarBtn">+</button>
        <div id="main">
            <iframe name="display" class="display" src="projects.html"></iframe>
        </div>
    </body>

    <script>
        const sidebar = document.getElementById('sidebar');
        let isResizing = false;

        sidebar.addEventListener('mousedown', (e) => {
            const edgeZone = 100; // grab zone size

            if (sidebar.offsetWidth - e.clientX < edgeZone) {
                isResizing = true;
                document.body.style.cursor = 'col-resize';
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;

            const newWidth = e.clientX;
            if (newWidth > 250 && newWidth < window.innerWidth - 100) {
                sidebar.style.width = newWidth + 'px';
            }
        });

        document.addEventListener('mouseup', () => {
            isResizing = false;
            document.body.style.cursor = 'default';
        });


        /* Sidebar toggle functionality */
        const toggleBtn = document.getElementById('openSidebarBtn');

        toggleBtn.addEventListener('click', () => {
            if (sidebar.style.display === 'block') {
                sidebar.style.display = 'none';
                toggleBtn.textContent = '+';
                toggleBtn.style.left = '0px';        // collapsed position
            } else {
                sidebar.style.display = 'block';
                toggleBtn.textContent = '×';
                toggleBtn.style.left = sidebar.offsetWidth + 'px';   // follow sidebar
            }

        });

        window.addEventListener('resize', () => {
            if (window.innerWidth > 600) {
                sidebar.style.display = 'block';   // restore sidebar on desktop
                toggleBtn.textContent = '×';
                toggleBtn.style.left = 0 + 'px'; 
            }
        });
        
        window.addEventListener('resize', () => {
            if (window.innerWidth < 600) {
                sidebar.style.display = 'block'; 
                toggleBtn.textContent = '×';
                toggleBtn.style.left = sidebar.offsetWidth + 'px'; 
            }
        });
        

        function toggleSidebar() {
            document.body.classList.toggle('sidebar-open');
        }

        
    </script>
</html>
